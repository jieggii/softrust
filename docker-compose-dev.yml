services:
  backend:
    build:
      context: ./services/backend
    env_file:
      - backend.env
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./services/frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - ./.data/mongo:/data/db