openapi: 3.0.4
info:
  title: softrust
  version: 0.1.0

paths:
  /report:
    post:
      summary: Start report generation
      description: Starts async report generation and returns the report id.
      operationId: CreateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Query parameter for report generation
      responses:
        "200":
          description: Report creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStartResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Failed to start report generation"

  /report/{id}:
    get:
      summary: Get generated report
      description: Returns the report object by id.
      operationId: GetReportByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A report object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportGetResponse"
        "400":
          description: Invalid report ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Invalid report ID"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Report not found"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Failed to retrieve report"

components:
  schemas:
    ReportStartResponse:
      type: object
      properties:
        id:
          type: string
      required: [id]

    ProductMeta:
      additionalProperties: false
      nullable: true
      properties:
        name:
          type: string
        vendor:
          type: string
        classification:
          type: string
        short_description:
          type: string
        alternatives:
          type: array
          items:
            type: string
      required: [ name, vendor, classification, short_description, alternatives ]

    ReportContent:
      type: object
      properties:
        meta:
          allOf:
            - $ref: "#/components/schemas/ProductMeta"
      required: [meta]

    ReportGetResponse:
      type: object
      properties:
        id:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [unknown, pending, ready, failed]
        created_at:
          type: string
          format: date-time
        content:
          allOf:
            - $ref: "#/components/schemas/ReportContent"


      required: [id, query, status, created_at]

